name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate shell scripts and privacy boundaries
        run: |
          for script in build.sh Tools/*.sh; do zsh -n "$script"; done
          python3 Tools/check-source.py
      - name: Build native app
        run: ./build.sh
      - name: Run protocol checks (no Bluetooth hardware)
        run: '"build/FreeBuds Kontrol.app/Contents/MacOS/FreeBudsKontrol" --self-test'
      - name: Verify bundle and package
        run: |
          plutil -lint "build/FreeBuds Kontrol.app/Contents/Info.plist"
          codesign --verify --deep --strict "build/FreeBuds Kontrol.app"
          ./Tools/package.sh
          unzip -tq "dist/FreeBuds-Kontrol-$(cat VERSION)-$ARCH.zip"
      - name: Upload checked release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
